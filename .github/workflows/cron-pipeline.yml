name: Hourly Job Pipeline

on:
  # schedule disabled – using cron-job.org for precise hourly timing
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-match:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      FETCH_SECRET: ${{ secrets.FETCH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Fetch new jobs from Adzuna
        run: |
          echo "Fetching jobs from ${APP_URL}..."
          HTTP_CODE=$(curl -s -o /tmp/fetch.json -w "%{http_code}" -X POST "${APP_URL}/api/fetch-jobs" -H "x-fetch-secret: ${FETCH_SECRET}" --max-time 60)
          cat /tmp/fetch.json
          echo ""
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Fetch failed with HTTP $HTTP_CODE"
          fi

      - name: Wait for jobs to be stored
        run: sleep 15

      - name: Run matching and send emails
        run: |
          echo "Running match pipeline..."
          HTTP_CODE=$(curl -s -o /tmp/match.json -w "%{http_code}" -X POST "${APP_URL}/api/cron/match" -H "x-cron-secret: ${CRON_SECRET}" --max-time 120)
          cat /tmp/match.json
          echo ""
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Match pipeline failed with HTTP $HTTP_CODE"
            exit 1
          fi
