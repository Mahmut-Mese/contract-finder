name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx next build
        env:
          # Dummy values so the build doesn't fail on missing env vars
          MYSQL_HOST: localhost
          MYSQL_DATABASE: contract_finder
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          AUTH_SECRET: ci-dummy-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
